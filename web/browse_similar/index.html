<html>
  <head>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" type="module"></script>
  </head>

  <body>
    <div id="page">
      <div id="pane-top">
        <div id="pane-left">
          <h1>Latent</h1>
          <img id="latent-image" src="/spinner.gif" />
        </div>
        <div id="pane-center">
          <div id="crop-editor">
            <img id="main" src="/spinner.gif" />
            <div id="crop-box">
              <button id="crop-button">Add Crop</button>
            </div>
          </div>
        </div>
        <div id="pane-right">
          <h1>Tags</h1>
          <div id="tags-assigned">
            <div id="tags-assigned-positive"></div>
            <div id="tags-assigned-negative"></div>
          </div>
          <div id="tags-textbox-wrap">
            <span class="tag">
              <input class="tag-label" id="tags-textbox" type="text" />
              <span class="tag-detail">+</span>
            </span>
          </div>
          <div id="tags-suggested"></div>
        </div>
      </div>
      <div id="pane-bottom">
        <div id="roster"></div>
      </div>
    </div>
  </body>
</html>
